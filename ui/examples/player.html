<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/dist/tokens.css"><link rel="stylesheet" href="../papel.css"><style>body{margin:0;padding:24px;background:#1c1c1c;display:flex;gap:24px;flex-wrap:wrap}</style><title>papél / player</title>
<!-- now playing: barcode + mark on the header row, big lowercase title, one-style info lines, hairline progress -->
<section class="papel papel-sheet" style="--papel-scale:2">
  <div class="papel-ornament"><img src="barcode-dobby.svg" alt="barcode: dobby"></div>
  <div class="papel-mark"><img src="../../mark/mark.svg" alt="[●]™"></div>
  <div class="papel-column">
    <p class="papel-title">Xtal</p>
    <div class="papel-info" style="margin-top:calc(3px * var(--k))">
      <span class="papel-name">Aphex Twin</span>
      <span>Selected Ambient Works 85-92</span>
      <span class="papel-year">1992</span>
    </div>
  </div>
  <div class="papel-progress" style="--value:.04"></div>
  <div class="papel-times"><span>0:06</span><span class="papel-quiet">1/1</span><span>-2:53</span></div>
</section>
